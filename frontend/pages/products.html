<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgenCart — Products</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="../index.html" aria-label="AgenCart home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 8.5h14l-1 11H6l-1-11Z"/><path d="M8.5 9V6.8a3.5 3.5 0 0 1 7 0V9"/><path d="m9 14 2 2 4-4"/></svg></span><span class="brand-copy"><span class="brand-name">AgenCart</span><span class="brand-tagline">where agents can shop</span></span></a>
    <nav class="nav">
      <a href="./products.html">Products</a>
      <span id="navAuth" data-prefix=""></span>
    </nav>
  </header>

  <main class="container section">
    <div class="page-heading">
      <div>
        <span class="eyebrow">Store</span>
        <h1>Products</h1>
      </div>

      <div class="page-tools">
        <label class="filter-label">
          Category
          <select id="categoryFilter">
            <option value="">All categories</option>
          </select>
        </label>

        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Search products...">
        </div>
      </div>
    </div>

    <div id="productGrid" class="product-grid">
      <p class="muted">Loading products...</p>
    </div>

    <p id="productMessage" class="muted"></p>
  </main>

  <footer class="footer">
    <div class="container">AgenCart · Built for agentic commerce</div>
  </footer>

  <script type="module" src="../js/products.js"></script>
</body>
</html>
