<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopAI — Products</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="../index.html">ShopAI</a>
    <nav class="nav">
      <a href="./products.html">Products</a>
      <span id="navAuth" data-prefix=""></span>
    </nav>
  </header>

  <main class="container section">
    <div class="page-heading">
      <div>
        <span class="eyebrow">Store</span>
        <h1>Products</h1>
      </div>

      <div class="page-tools">
        <label class="filter-label">
          Category
          <select id="categoryFilter">
            <option value="">All categories</option>
          </select>
        </label>

        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Search products...">
        </div>
      </div>
    </div>

    <div id="productGrid" class="product-grid">
      <p class="muted">Loading products...</p>
    </div>

    <p id="productMessage" class="muted"></p>
  </main>

  <footer class="footer">
    <div class="container">ShopAI · Built for agentic commerce</div>
  </footer>

  <script type="module" src="../js/products.js"></script>
</body>
</html>
