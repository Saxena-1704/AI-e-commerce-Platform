<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgenCart — Register</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <a class="brand" href="../index.html" aria-label="AgenCart home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 8.5h14l-1 11H6l-1-11Z"/><path d="M8.5 9V6.8a3.5 3.5 0 0 1 7 0V9"/><path d="m9 14 2 2 4-4"/></svg></span><span class="brand-copy"><span class="brand-name">AgenCart</span><span class="brand-tagline">where agents can shop</span></span></a>
    <nav class="nav">
      <a href="./products.html">Products</a>
      <span id="navAuth" data-prefix=""></span>
    </nav>
  </header>

  <main class="auth-shell">
    <section class="auth-card">
      <span class="eyebrow">Get started</span>
      <h1>Create account</h1>
      <p class="muted">Create a customer account to start shopping.</p>

      <div id="formMessage" class="form-message hidden"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input id="registerName" type="text" name="full_name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="registerPhone">Phone number</label>
          <input id="registerPhone" type="tel" name="phone_number" autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" name="password" autocomplete="new-password" minlength="8" required>
        </div>

        <button class="button button-primary full-width" type="submit">Create account</button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="./login.html">Log in</a>
      </p>
    </section>
  </main>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
